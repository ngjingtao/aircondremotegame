<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="早餐三明治：搭配一份均衡的早餐，再把蛋煎到刚刚好。" />
<meta name="format-detection" content="telephone=no" />
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="早餐三明治" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<!-- /pwa -->
<title>早餐三明治 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="sandwich.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">🥪</span>
      <span class="tb-title" data-i18n="title">Breakfast Sandwich</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudBalance">Balance</span><b id="hud-balance">55%</b></div>
      <div class="hud-chip hud-score"><span class="hud-label" data-i18n="hudPan">Pan</span><b id="hud-pan">MEDIUM</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <!-- ══════════ LEFT PANEL ══════════ -->
    <section id="ctl-panel">
      <div id="ctl-scaler">
        <div class="ctl" id="ctl">

          <div class="ctl-block">
            <div class="ctl-label" data-i18n="bread">BREAD</div>
            <div class="seg three" id="bread-row"></div>
          </div>

          <div class="ctl-block">
            <div class="ctl-label" data-i18n="spread">SPREAD</div>
            <div class="seg four" id="spread-row"></div>
          </div>

          <div class="ctl-block">
            <div class="ctl-label" data-i18n="filling">FILLING</div>
            <div class="seg four" id="filling-row"></div>
          </div>

          <div class="ctl-block">
            <div class="ctl-label" data-i18n="veg">VEGETABLE</div>
            <div class="seg four" id="veg-row"></div>
          </div>

          <div class="cook-panel" id="cook-panel" hidden>
            <div class="safety-note" data-i18n="cookSafety">Ask an adult: a real pan and stove get very hot. This is a simulation — cook with a grown-up.</div>
            <div class="ctl-label" data-i18n="heat">HEAT</div>
            <div class="seg three" id="heat-row"></div>
            <div class="cook-card">
              <span class="cook-time" id="cook-time">0.0 s</span>
              <div class="cook-bar">
                <i id="cook-band"></i>
                <b id="cook-mark"></b>
              </div>
            </div>
          </div>

          <div class="adult-chip" data-i18n="cookAdult">👤 Ask an adult</div>
          <button class="start-btn" data-action="action" id="sandwich-action" data-i18n="toPan">TO THE PAN</button>

          <div class="result" id="sandwich-result" hidden>
            <div class="res-stars" id="sandwich-stars">☆☆☆</div>
            <p id="sandwich-res-text"></p>
          </div>

        </div>
      </div>
    </section>

    <!-- ══════════ SCENE ══════════ -->
    <section id="scene" data-phase="build">

      <div class="scene-top">
        <span class="scene-lead" id="scene-lead" data-i18n="lead">Breakfast</span>
        <span class="scene-status" id="scene-status" data-i18n="statusBuild">Ready</span>
      </div>

      <div class="art-wrap">
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#213044"/>
              <stop offset="100%" stop-color="#172333"/>
            </linearGradient>
            <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c49a6c"/>
              <stop offset="100%" stop-color="#8a6236"/>
            </linearGradient>
            <radialGradient id="panGlowGrad">
              <stop offset="0%" stop-color="rgba(255,150,60,.55)"/>
              <stop offset="100%" stop-color="rgba(255,150,60,0)"/>
            </radialGradient>
            <linearGradient id="toastGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f4f1e8"/>
              <stop offset="100%" stop-color="#cfd4d8"/>
            </linearGradient>
            <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1220" flood-opacity="0.4"/>
            </filter>
          </defs>

          <!-- kitchen -->
          <rect x="0" y="0" width="340" height="400" fill="url(#wallGrad)"/>
          <rect x="0" y="0" width="340" height="8" fill="#0d1622"/>
          <rect x="0" y="400" width="340" height="120" fill="url(#counterGrad)"/>
          <rect x="0" y="400" width="340" height="6" fill="#e0b988"/>
          <rect x="0" y="494" width="340" height="26" fill="#6b4a2a"/>

          <!-- window -->
          <g id="window">
            <rect x="26" y="40" width="74" height="84" rx="4" fill="#14293d" stroke="#9fb0c4" stroke-width="3"/>
            <rect x="31" y="45" width="64" height="74" fill="#2b5670"/>
            <circle cx="78" cy="64" r="10" fill="#ffd166" opacity=".85"/>
            <path d="M31 100 q14 -14 28 0 q14 -12 36 0 v19 H31 Z" fill="#4f8a3c" opacity=".8"/>
            <path d="M63 45 V119 M31 82 H95" stroke="#9fb0c4" stroke-width="2"/>
          </g>

          <!-- toaster -->
          <g id="toaster" filter="url(#soft)">
            <rect x="18" y="318" width="72" height="82" rx="10" fill="url(#toastGrad)" stroke="#aab4c0" stroke-width="1.6"/>
            <rect x="28" y="330" width="52" height="7" rx="3.5" fill="#9aa5b2"/>
            <rect x="36" y="308" width="18" height="16" rx="4" fill="#e8b86a" stroke="#c99a5b" stroke-width="1"/>
            <rect x="58" y="308" width="18" height="16" rx="4" fill="#e8b86a" stroke="#c99a5b" stroke-width="1"/>
            <rect x="26" y="352" width="10" height="26" rx="3" fill="#c8d1dd"/>
            <circle cx="70" cy="374" r="6" fill="#e0a51e"/>
          </g>

          <!-- pan -->
          <g id="panGroup" opacity="0">
            <ellipse id="panGlow" cx="140" cy="366" rx="64" ry="52" fill="url(#panGlowGrad)" opacity="0"/>
            <path d="M84 360 q-18 -4 -22 -18" fill="none" stroke="#39414d" stroke-width="9" stroke-linecap="round"/>
            <ellipse cx="140" cy="368" rx="58" ry="30" fill="#39414d" stroke="#232a33" stroke-width="2"/>
            <ellipse cx="140" cy="364" rx="52" ry="25" fill="#4b5563"/>
            <ellipse cx="140" cy="362" rx="45" ry="20" fill="#222b36"/>
            <g id="eggGroup">
              <ellipse id="panEgg" cx="140" cy="362" rx="28" ry="15" fill="#fffdf5" stroke="#e4d8bc" stroke-width="1"/>
              <circle id="panYolk" cx="142" cy="360" r="8" fill="#ffd34d" stroke="#e0a51e" stroke-width="1"/>
              <ellipse cx="126" cy="366" rx="14" ry="4" fill="#ffb3a8" opacity=".5"/>
            </g>
            <ellipse cx="140" cy="368" rx="58" ry="30" fill="none" stroke="#20262e" stroke-width="3"/>
          </g>

          <!-- plate + sandwich stack -->
          <g id="plate">
            <ellipse cx="250" cy="415" rx="62" ry="12" fill="#dbe5f0" stroke="#9fb0c4" stroke-width="1.4"/>
            <ellipse cx="250" cy="412" rx="50" ry="8" fill="#eef3f9"/>
          </g>
          <g id="stackGroup" opacity="0">
            <rect id="breadBottom" x="205" y="379" width="90" height="22" rx="9" fill="#f0c987" stroke="#c99a5b" stroke-width="1.2"/>
            <rect id="spreadLayer" x="211" y="374" width="78" height="8" rx="4" fill="#ffd36a" opacity="0"/>
            <g id="fillEgg" opacity="0">
              <ellipse cx="250" cy="367" rx="38" ry="12" fill="#fffdf5" stroke="#e4d8bc" stroke-width=".8"/>
              <circle cx="250" cy="365" r="6" fill="#ffd34d" stroke="#e0a51e" stroke-width=".8"/>
            </g>
            <g id="fillCheese" opacity="0">
              <path d="M216 370 L250 360 L284 370 L250 379 Z" fill="#ffd166" stroke="#e0a51e" stroke-width=".8"/>
            </g>
            <g id="fillBacon" opacity="0">
              <path d="M216 370 q12 -7 22 0 t22 0 t22 0" fill="none" stroke="#c05a36" stroke-width="5" stroke-linecap="round"/>
            </g>
            <g id="vegTomato" opacity="0">
              <circle cx="228" cy="359" r="7" fill="#e2453c" stroke="#a82f28" stroke-width=".8"/>
              <circle cx="250" cy="357" r="7" fill="#e2453c" stroke="#a82f28" stroke-width=".8"/>
              <circle cx="272" cy="359" r="7" fill="#e2453c" stroke="#a82f28" stroke-width=".8"/>
            </g>
            <g id="vegSpinach" opacity="0">
              <path d="M220 358 q14 -12 24 0 q-10 8 -24 0" fill="#4f8a3c" stroke="#3f7a32" stroke-width=".8"/>
              <path d="M248 356 q14 -12 24 0 q-10 8 -24 0" fill="#6fae50" stroke="#3f7a32" stroke-width=".8"/>
            </g>
            <g id="vegLettuce" opacity="0">
              <path d="M214 360 q10 -14 22 -2 q10 -12 22 0 q12 -12 22 2" fill="none" stroke="#8ecf72" stroke-width="6" stroke-linecap="round"/>
            </g>
            <path id="breadTop" d="M204 350 q0 -14 14 -14 h64 q14 0 14 14 v15 h-92 Z" fill="#f0c987" stroke="#c99a5b" stroke-width="1.2"/>
            <g fill="#fff7e0" opacity=".85">
              <ellipse cx="226" cy="344" rx="2.4" ry="1.2"/>
              <ellipse cx="246" cy="341" rx="2.4" ry="1.2"/>
              <ellipse cx="268" cy="344" rx="2.4" ry="1.2"/>
            </g>
          </g>

          <!-- steaming -->
          <g id="steam"></g>

          <!-- mug and plant -->
          <g id="mug">
            <rect x="104" y="428" width="30" height="26" rx="5" fill="#8fd0ff" stroke="#4aa8de" stroke-width="1.5"/>
            <path d="M134 434 q10 4 0 12" fill="none" stroke="#4aa8de" stroke-width="3"/>
            <ellipse cx="119" cy="428" rx="15" ry="4" fill="#c8ecff"/>
          </g>
          <g id="plant">
            <rect x="304" y="424" width="24" height="22" rx="3" fill="#b8543f"/>
            <path d="M316 424 q-16 -20 -4 -30 q10 10 4 30" fill="#6fae50"/>
            <path d="M316 424 q16 -18 6 -28 q-12 8 -6 28" fill="#4f8a3c"/>
          </g>

          <!-- labels -->
          <g id="labels">
            <g class="lab" data-lab="pan"><text x="140" y="414" text-anchor="middle" data-i18n="lPan">pan</text></g>
            <g class="lab" data-lab="egg"><text x="184" y="346" text-anchor="start" data-i18n="lEgg">egg</text></g>
            <g class="lab" data-lab="bread"><text x="306" y="388" text-anchor="end" data-i18n="lBread">bread</text></g>
            <g class="lab" data-lab="spread"><text x="306" y="374" text-anchor="end" data-i18n="lSpread">spread</text></g>
            <g class="lab" data-lab="filling"><text x="306" y="360" text-anchor="end" data-i18n="lFilling">filling</text></g>
            <g class="lab" data-lab="veg"><text x="306" y="346" text-anchor="end" data-i18n="lVeg">veg</text></g>
            <g class="lab" data-lab="plate"><text x="250" y="442" text-anchor="middle" data-i18n="lPlate">plate</text></g>
          </g>
        </svg>
      </div>

      <div class="pane-note" id="pane-note"></div>
      <div class="toast" id="toast"></div>
    </section>

  </main>
</div>

<div id="help-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="help-title">Make a breakfast sandwich</h2>
    <div id="help-body" class="help-body"></div>
    <button class="overlay-close" id="help-close">OK</button>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/scene.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
