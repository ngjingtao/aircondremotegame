<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="洗衣日：选择程序、水温、脱水和烘干，把衣服洗得干净又不缩水。" />
<meta name="format-detection" content="telephone=no" />
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="洗衣日" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<!-- /pwa -->
<title>洗衣日 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="laundry.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">🧺</span>
      <span class="tb-title" data-i18n="title">Laundry Day</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudClean">Clean</span><b id="hud-clean">0%</b></div>
      <div class="hud-chip hud-score"><span class="hud-label" data-i18n="hudMoisture">Moisture</span><b id="hud-moisture">52%</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <!-- ══════════ LEFT PANEL ══════════ -->
    <section id="ctl-panel">
      <div id="ctl-scaler">
        <div class="ctl" id="ctl">

          <div class="ctl-tabs">
            <button class="tab on" id="tab-wash" data-action="tab" data-tab="wash">
              <span>🧼</span><b data-i18n="tabWash">WASH</b>
            </button>
            <button class="tab" id="tab-dry" data-action="tab" data-tab="dry">
              <span>💨</span><b data-i18n="tabDry">DRY</b>
            </button>
          </div>

          <!-- ── washing machine ── -->
          <div class="pane" id="pane-wash">
            <div class="ctl-block">
              <div class="ctl-label" data-i18n="loadLabel">LOAD</div>
              <div class="seg three" id="load-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="program">PROGRAMME</div>
              <div class="seg four" id="program-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="temp">WATER</div>
              <div class="seg four" id="temp-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="spin">SPIN</div>
              <div class="seg three" id="spin-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="detergent">DETERGENT</div>
              <div class="seg three" id="det-row"></div>
            </div>

            <div class="phase-card">
              <span id="wash-phase">Ready</span>
              <div class="phase-bar"><i id="wash-progress"></i></div>
            </div>

            <button class="start-btn" data-action="start" id="wash-start" data-i18n="start">START</button>

            <div class="result" id="wash-result" hidden>
              <div class="res-stars" id="wash-stars">☆☆☆</div>
              <p id="wash-res-text"></p>
              <button class="res-btn" data-action="next"><span data-i18n="toDryer">TO THE DRYER</span> ›</button>
            </div>
          </div>

          <!-- ── tumble dryer ── -->
          <div class="pane" id="pane-dry" hidden>
            <div class="ctl-block">
              <div class="ctl-label" data-i18n="loadLabel">LOAD</div>
              <div class="seg three" id="load-row-dry"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="dryProgram">PROGRAMME</div>
              <div class="seg two" id="dry-program-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="dryness">DRYNESS</div>
              <div class="seg three" id="dryness-row"></div>
            </div>

            <div class="ctl-block">
              <div class="ctl-label" data-i18n="heat">HEAT</div>
              <div class="seg two" id="heat-row"></div>
            </div>

            <div class="phase-card">
              <span id="dry-phase">Ready</span>
              <div class="phase-bar"><i id="dry-progress"></i></div>
            </div>

            <button class="start-btn" data-action="start" id="dry-start" data-i18n="start">START</button>

            <div class="result" id="dry-result" hidden>
              <div class="res-stars" id="dry-stars">☆☆☆</div>
              <p id="dry-res-text"></p>
              <button class="res-btn" data-action="again" data-i18n="again">AGAIN</button>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ══════════ SCENE ══════════ -->
    <section id="scene" class="mode-wash">

      <div class="scene-top">
        <span class="scene-lead" id="scene-lead" data-i18n="leadWash">Washing machine</span>
        <span class="scene-status" id="scene-status" data-i18n="statusIdle">Ready</span>
      </div>

      <div class="art-wrap">
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="washGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f8fafc"/>
              <stop offset="55%" stop-color="#e4eaf2"/>
              <stop offset="100%" stop-color="#c5d1de"/>
            </linearGradient>
            <linearGradient id="dryGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff6ef"/>
              <stop offset="55%" stop-color="#f0e3d8"/>
              <stop offset="100%" stop-color="#d6c5b7"/>
            </linearGradient>
            <radialGradient id="glassGrad" cx="35%" cy="28%" r="80%">
              <stop offset="0%" stop-color="#8fb6d6"/>
              <stop offset="60%" stop-color="#38536d"/>
              <stop offset="100%" stop-color="#16263a"/>
            </radialGradient>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a8e2ff"/>
              <stop offset="100%" stop-color="#3c9fd0"/>
            </linearGradient>
            <radialGradient id="heatGrad">
              <stop offset="0%" stop-color="rgba(255,120,60,.85)"/>
              <stop offset="55%" stop-color="rgba(255,170,90,.35)"/>
              <stop offset="100%" stop-color="rgba(255,190,120,0)"/>
            </radialGradient>
            <linearGradient id="basketGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c89a63"/>
              <stop offset="100%" stop-color="#8a6236"/>
            </linearGradient>
            <clipPath id="washerClip"><circle cx="89" cy="310" r="44"/></clipPath>
            <clipPath id="dryerClip"><circle cx="249" cy="310" r="44"/></clipPath>
            <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1220" flood-opacity="0.42"/>
            </filter>
          </defs>

          <!-- room -->
          <rect x="0" y="0" width="340" height="520" fill="#101a2a"/>
          <rect x="0" y="0" width="340" height="104" fill="#162335"/>
          <rect x="0" y="430" width="340" height="90" fill="#1b2838"/>
          <rect x="0" y="430" width="340" height="5" fill="#2b3c51"/>

          <!-- ═════ washing machine ═════ -->
          <g id="washer" filter="url(#soft)">
            <rect x="14" y="118" width="150" height="312" rx="18" fill="url(#washGrad)" stroke="#aab8c8" stroke-width="2"/>

            <rect x="24" y="130" width="130" height="52" rx="9" fill="#203348"/>
            <rect x="28" y="134" width="122" height="44" rx="7" fill="#16283a"/>
            <text id="washerDisplay" x="86" y="158" text-anchor="middle" class="display">40°</text>
            <circle id="washerKnob" cx="134" cy="158" r="8" fill="#c9d6e4" stroke="#8fa2b6" stroke-width="1.5"/>
            <circle cx="34" cy="146" r="2.4" fill="#8ef0b4"/>
            <circle cx="34" cy="158" r="2.2" fill="#5d7085"/>

            <rect x="24" y="190" width="130" height="7" rx="3.5" fill="#b7c6d6"/>

            <!-- detergent drawer -->
            <g id="detergentDrawer">
              <rect x="24" y="202" width="44" height="17" rx="4" fill="#d6e0eb" stroke="#aebdcd" stroke-width="1.2"/>
              <rect x="30" y="207" width="24" height="6" rx="2" fill="#8fd0ff"/>
              <rect x="58" y="207" width="5" height="6" rx="1.5" fill="#6fb7e6"/>
            </g>

            <!-- door -->
            <circle cx="89" cy="310" r="59" fill="#dbe5f0" stroke="#9fb0c4" stroke-width="2"/>
            <circle cx="89" cy="310" r="51" fill="#152437"/>
            <circle cx="89" cy="310" r="47" fill="url(#glassGrad)"/>

            <g clip-path="url(#washerClip)">
              <rect id="washerWater" x="45" y="354" width="88" height="0" fill="url(#waterGrad)" opacity="0"/>
              <g id="washerDrum">
                <circle cx="89" cy="310" r="44" fill="#1a2b3e" opacity="0.35"/>
                <g stroke="#3d5570" stroke-width="3" stroke-linecap="round">
                  <path d="M62 282 L77 290"/>
                  <path d="M101 330 L116 338"/>
                  <path d="M101 290 L116 282"/>
                </g>
                <g id="washerClothes"></g>
              </g>
              <g id="washerFoam"></g>
            </g>

            <circle cx="89" cy="310" r="59" fill="none" stroke="#e8f0f8" stroke-width="2" opacity="0.35"/>
            <circle cx="89" cy="310" r="52" fill="none" stroke="#7f93a8" stroke-width="1.4" opacity="0.5"/>
          </g>

          <!-- ═════ tumble dryer ═════ -->
          <g id="vent">
            <rect x="292" y="104" width="26" height="14" rx="3" fill="#7d8a99" stroke="#5b6874" stroke-width="1.2"/>
            <path d="M296 108 H314 M296 112 H314" stroke="#4f5b67" stroke-width="1.2"/>
          </g>

          <g id="dryer" filter="url(#soft)">
            <rect x="176" y="118" width="150" height="312" rx="18" fill="url(#dryGrad)" stroke="#c0aa99" stroke-width="2"/>

            <rect x="186" y="130" width="130" height="52" rx="9" fill="#3d2f2a"/>
            <rect x="190" y="134" width="122" height="44" rx="7" fill="#2b211d"/>
            <text id="dryerDisplay" x="248" y="158" text-anchor="middle" class="display warm">52%</text>
            <circle id="dryerKnob" cx="294" cy="158" r="8" fill="#f2dcc9" stroke="#b89a80" stroke-width="1.5"/>
            <circle cx="196" cy="146" r="2.4" fill="#ffb37a"/>
            <circle cx="196" cy="158" r="2.2" fill="#8a7462"/>

            <rect x="186" y="190" width="130" height="7" rx="3.5" fill="#d6c4b4"/>

            <!-- lint filter slot -->
            <g id="lintFilter">
              <rect x="268" y="202" width="42" height="17" rx="4" fill="#e6d6c6" stroke="#bda894" stroke-width="1.2"/>
              <path d="M274 206 V215 M280 206 V215 M286 206 V215 M292 206 V215 M298 206 V215 M304 206 V215" stroke="#b39b84" stroke-width="1.2"/>
            </g>

            <!-- door -->
            <circle cx="249" cy="310" r="59" fill="#e8d9ca" stroke="#b9a28f" stroke-width="2"/>
            <circle cx="249" cy="310" r="51" fill="#1c2430"/>
            <circle cx="249" cy="310" r="47" fill="url(#glassGrad)"/>

            <g clip-path="url(#dryerClip)">
              <circle id="dryerGlow" cx="249" cy="310" r="44" fill="url(#heatGrad)" opacity="0"/>
              <g id="dryerDrum">
                <circle cx="249" cy="310" r="44" fill="#1a2431" opacity="0.42"/>
                <g stroke="#5b4a3e" stroke-width="3" stroke-linecap="round">
                  <path d="M222 282 L237 290"/>
                  <path d="M261 330 L276 338"/>
                  <path d="M261 290 L276 282"/>
                </g>
                <g id="dryerClothes"></g>
              </g>
            </g>

            <circle cx="249" cy="310" r="59" fill="none" stroke="#fff5ea" stroke-width="2" opacity="0.4"/>
            <circle cx="249" cy="310" r="52" fill="none" stroke="#a08c7a" stroke-width="1.4" opacity="0.5"/>
          </g>

          <!-- steam out of the vent -->
          <g id="dryerSteam"></g>

          <!-- ═════ laundry basket ═════ -->
          <g id="basket">
            <ellipse cx="170" cy="500" rx="58" ry="7" fill="#000" opacity="0.22"/>
            <path d="M122 438 H218 L210 496 H130 Z" fill="url(#basketGrad)" stroke="#6f4e2b" stroke-width="1.6"/>
            <path d="M133 434 q18 -14 36 0 q16 -11 33 1" fill="none" stroke="#f6bb8a" stroke-width="5" stroke-linecap="round"/>
            <path d="M140 430 q10 -18 23 -3" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
            <path d="M127 452 H213 M130 470 H208 M134 486 H204" stroke="#6f4e2b" stroke-width="1.4" opacity="0.55"/>
          </g>

          <!-- ═════ labels ═════ -->
          <g id="labels">
            <g class="lab" data-lab="washer"><text x="89" y="112" text-anchor="middle" data-i18n="lWasher">washer</text></g>
            <g class="lab" data-lab="dryer"><text x="249" y="112" text-anchor="middle" data-i18n="lDryer">dryer</text></g>
            <g class="lab" data-lab="drum"><text x="89" y="390" text-anchor="middle" data-i18n="lDrum">drum</text></g>
            <g class="lab" data-lab="detergent"><text x="18" y="228" text-anchor="start" data-i18n="lDetergent">detergent</text></g>
            <g class="lab" data-lab="lint"><text x="322" y="228" text-anchor="end" data-i18n="lLint">lint filter</text></g>
            <g class="lab" data-lab="vent"><text x="326" y="98" text-anchor="end" data-i18n="lVent">vent</text></g>
            <g class="lab" data-lab="basket"><text x="170" y="514" text-anchor="middle" data-i18n="lBasket">basket</text></g>
          </g>
        </svg>
      </div>

      <div class="pane-note" id="pane-note"></div>
      <div class="toast" id="toast"></div>
    </section>

  </main>
</div>

<div id="help-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="help-title">Washing and drying</h2>
    <div id="help-body" class="help-body"></div>
    <button class="overlay-close" id="help-close">OK</button>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/scene.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
