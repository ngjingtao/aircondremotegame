<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="扬声器：看电信号怎样让线圈和振膜运动，把电流变成声音，并认识频率和振幅。" />
<meta name="format-detection" content="telephone=no" />
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="扬声器" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<!-- /pwa -->
<title>扬声器 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="../shared/lesson.css" />
<link rel="stylesheet" href="speaker.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html#machines" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">🔊</span>
      <span class="tb-title" data-i18n="title">Speaker</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudStep">Step</span><b id="hud-step">1 / 6</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <section id="ctl-panel">
      <div id="ctl-scaler">
        <div class="ctl" id="ctl">

          <div class="ls-head">
            <span class="ls-kicker" data-i18n="lead">Speaker</span>
            <span class="ls-count" id="ls-count">1 / 6</span>
            <button class="ls-read" id="ls-replay" data-action="replay" title="Read again">🔊</button>
          </div>
          <div class="ls-track"><i id="ls-bar"></i></div>

          <div class="ls-steps" id="ls-steps"></div>

          <h3 class="ls-title" id="ls-title"></h3>
          <div class="fact-card ls-fact" id="ls-fact"></div>

          <div class="ls-words" id="ls-words"></div>
          <div class="ls-worddef" id="ls-worddef" hidden></div>

          <div class="nav-row">
            <button class="nav-btn" id="ls-back" data-action="prev" data-i18n="back">BACK</button>
            <button class="nav-btn go" id="ls-next" data-action="next" data-i18n="next">NEXT</button>
          </div>

          <div class="result" id="ls-result" hidden>
            <div class="res-stars">★☆☆</div>
            <p id="ls-result-text"></p>
            <button class="nav-btn" data-action="again" data-i18n="again">START AGAIN</button>
          </div>

        </div>
      </div>
    </section>

    <section id="scene">

      <div class="scene-top">
        <span class="scene-lead" data-i18n="lead">Speaker</span>
        <span class="scene-status" id="scene-status" data-i18n="status">Following the sound</span>
      </div>

      <div class="art-wrap">
        <img id="art-plate" class="art-plate" alt="" hidden />
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="spkSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#182233"/>
              <stop offset="100%" stop-color="#0a1018"/>
            </linearGradient>
            <linearGradient id="spkCone" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#aebccb"/>
              <stop offset="100%" stop-color="#e6eef7"/>
            </linearGradient>
            <linearGradient id="spkCopper" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e0a35e"/>
              <stop offset="100%" stop-color="#a86a2e"/>
            </linearGradient>
            <radialGradient id="spkGlow">
              <stop offset="0%" stop-color="#ffd166" stop-opacity=".55"/>
              <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <rect width="340" height="520" fill="url(#spkSky)"/>

          <!-- the cabinet, cut open -->
          <g id="speaker" data-lab="speaker">
            <rect x="20" y="180" width="250" height="250" rx="14" fill="#202834" stroke="#3b4d68" stroke-width="2"/>
            <rect x="20" y="180" width="250" height="10" rx="5" fill="#2b3440"/>
          </g>

          <!-- cone / diaphragm -->
          <g id="cone" data-lab="cone pitch volume">
            <path d="M112 250 L262 200 L262 420 L112 370 Z" fill="url(#spkCone)" stroke="#9fb0c4" stroke-width="1.5"/>
            <rect x="256" y="196" width="12" height="228" rx="6" fill="#8fa0b4"/>
            <ellipse cx="262" cy="310" rx="7" ry="42" fill="#c8d1dd" opacity=".55"/>
            <path d="M112 250 L112 370" stroke="#8fa0b4" stroke-width="2"/>
          </g>

          <!-- magnet and voice coil -->
          <g id="magnet" data-lab="motor signal">
            <circle cx="88" cy="310" r="36" fill="#5b6b7d" stroke="#8fa0b4" stroke-width="2"/>
            <path d="M88 274 a36 36 0 0 1 0 72 Z" fill="#e85d5d" opacity=".85"/>
            <path d="M88 274 a36 36 0 0 0 0 72 Z" fill="#4aa8de" opacity=".85"/>
            <circle cx="88" cy="310" r="14" fill="#1b2430"/>
            <text x="72" y="315" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">S</text>
            <text x="104" y="315" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">N</text>
          </g>
          <g id="coil" data-lab="motor signal">
            <rect x="74" y="270" width="20" height="80" rx="9" fill="url(#spkCopper)" stroke="#8a5a2a" stroke-width="1.5"/>
            <path d="M76 284 h16 M76 298 h16 M76 312 h16 M76 326 h16" stroke="#7a4a1e" stroke-width="1.8"/>
            <rect x="94" y="298" width="18" height="24" rx="3" fill="#c98a4a"/>
          </g>

          <!-- the signal comes in -->
          <g id="amp" data-lab="signal">
            <rect x="20" y="50" width="80" height="70" rx="9" fill="#1b2430" stroke="#3b4d68" stroke-width="2"/>
            <path d="M32 85 q7 -22 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#8fd0ff" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="86" cy="108" r="5" fill="#ffd166"/>
            <text x="60" y="44" text-anchor="middle" font-size="9" font-weight="800" fill="#9fb3cc">AMP</text>
          </g>
          <path d="M60 120 V250 H84 V270" fill="none" stroke="#e85d5d" stroke-width="2.4" stroke-dasharray="6 5"/>
          
          <path d="M88 350 V400 H60" fill="none" stroke="#2b2830" stroke-width="2.4"/>
          <circle cx="56" cy="402" r="5" fill="#8fa0b4"/>

          <!-- the waveform display -->
          <g id="wavePanel">
            <rect x="120" y="40" width="200" height="90" rx="8" fill="#0b1220" stroke="#3b4d68" stroke-width="1.5"/>
            <path d="M130 60 V115 M150 50 V120 M190 50 V120 M230 50 V120 M270 50 V120 M310 50 V120" stroke="#233246" stroke-width="1"/>
            <path id="wave" d="M132 85 q14 -26 28 0 t28 0 t28 0 t28 0 t28 0" fill="none" stroke="#8fd0ff" stroke-width="2.6" stroke-linecap="round"/>
            <path id="waveHigh" d="M132 85 q6 -18 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#8ef0b4" stroke-width="2.6" stroke-linecap="round"/>
            <path id="waveBig" d="M132 85 q14 -40 28 0 t28 0 t28 0 t28 0 t28 0" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- motion, air and sound -->
          <g id="motion" data-lab="signal cone pitch volume">
            <path d="M40 286 V338 M34 292 L40 284 L46 292 M34 332 L40 340 L46 332"
                  fill="none" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="88" cy="310" r="52" fill="url(#spkGlow)" opacity=".35"/>
          </g>
          <g id="air" data-lab="cone">
            <circle cx="276" cy="250" r="2.4" fill="#8fd0ff"/>
            <circle cx="286" cy="278" r="2" fill="#8fd0ff"/>
            <circle cx="274" cy="308" r="2.6" fill="#8fd0ff"/>
            <circle cx="288" cy="338" r="2.2" fill="#8fd0ff"/>
            <circle cx="280" cy="368" r="2.4" fill="#8fd0ff"/>
          </g>
          <g id="waves" data-lab="cone pitch volume" fill="none" stroke="#8fd0ff" stroke-linecap="round">
            <path d="M284 240 q26 70 0 140" stroke-width="3" opacity=".55"/>
            <path d="M300 228 q36 82 0 164" stroke-width="3" opacity=".42"/>
            <path d="M316 216 q46 94 0 188" stroke-width="3" opacity=".3"/>
          </g>

          <!-- labels -->
          <g id="labels">
            <g class="lab" data-lab="speaker"><text x="145" y="452" text-anchor="middle" data-i18n="lSpeaker">speaker</text></g>
            <g class="lab" data-lab="motor"><text x="72" y="386" text-anchor="middle" data-i18n="lMagnet">magnet</text></g>
            <g class="lab" data-lab="motor signal"><text x="66" y="262" text-anchor="end" data-i18n="lCoil">coil</text></g>
            <g class="lab" data-lab="cone pitch volume"><text x="228" y="232" text-anchor="middle" data-i18n="lCone">cone</text></g>
            <g class="lab" data-lab="cone pitch volume"><text x="326" y="212" text-anchor="end" data-i18n="lSound">sound</text></g>
            <g class="lab" data-lab="signal"><text x="112" y="132" data-i18n="lSignal">signal</text></g>
            <g class="lab" data-lab="pitch"><text x="220" y="156" text-anchor="middle" data-i18n="lFrequency">frequency</text></g>
            <g class="lab" data-lab="volume"><text x="220" y="156" text-anchor="middle" data-i18n="lAmplitude">amplitude</text></g>
          </g>
        </svg>
      </div>

      <div class="pane-note" id="pane-note"></div>
    </section>

  </main>
</div>

<div id="help-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="help-title">How a speaker works</h2>
    <div id="help-body" class="help-body"></div>
    <button class="overlay-close" id="help-close">OK</button>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="../shared/art.js"></script>
<script src="js/scene.js"></script>
<script src="../shared/lesson.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
