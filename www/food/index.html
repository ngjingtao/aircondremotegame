<!DOCTYPE html>
<html lang="en">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Food Eating" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<!-- /pwa -->
<meta name="format-detection" content="telephone=no" />
<title>Food Eating · Play &amp; Learn</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="food.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">🍎</span>
      <span class="tb-title" data-i18n="title">Food Eating</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="mBelly">Belly</span><b id="hud-belly">10%</b></div>
      <div class="hud-chip hud-score"><span class="hud-label" data-i18n="mEnergy">Energy</span><b id="hud-energy">40</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-quiz" data-i18n="bQuiz">Start quiz</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <!-- ══════════ LEFT : CONTROL DECK ══════════ -->
    <section id="deck-panel">
      <div id="deck-scaler">
        <div class="deck">

          <div class="deck-head">
            <div class="stage-name">
              <span class="stage-icon" id="stage-icon">👄</span>
              <b id="stage-label">Mouth</b>
              <i id="stage-count">1 / 6</i>
            </div>
            <div class="stage-pips" id="stage-pips"></div>
          </div>

          <div class="tray-wrap">
            <div class="tray-title" data-i18n="pickFood">Pick a food</div>
            <div class="tray" id="tray"></div>
          </div>

          <div class="actions" id="actions"></div>

          <div class="meters" id="meters"></div>

          <div class="deck-foot">
            <button class="mode-btn active" id="btn-manual" data-i18n="manual">Manual</button>
            <button class="mode-btn" id="btn-watch" data-i18n="watch">Watch</button>
          </div>

        </div>
      </div>
    </section>

    <!-- ══════════ RIGHT : BODY ══════════ -->
    <section id="scene">

      <div class="scene-top">
        <span class="scene-stage" id="scene-stage">Mouth</span>
        <span class="scene-mood" id="scene-mood">Hungry</span>
      </div>

      <div class="body-wrap">
        <svg id="body" viewBox="-16 -24 296 456" preserveAspectRatio="xMidYMid meet" data-stage="MOUTH" data-mood="hungry">
          <defs>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe0c2"/>
              <stop offset="100%" stop-color="#f9c9a0"/>
            </linearGradient>
            <linearGradient id="torsoGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe3c8" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#f7c9a5" stop-opacity="0.55"/>
            </linearGradient>
            <linearGradient id="stomachGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffbb84"/>
              <stop offset="100%" stop-color="#e08c5a"/>
            </linearGradient>
            <radialGradient id="foodGlow">
              <stop offset="0%" stop-color="#fff6b0" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
            </radialGradient>
            <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3.4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.28"/>
            </filter>
          </defs>

          <!-- ───── body silhouette ───── -->
          <g id="figure" filter="url(#dropShadow)">
            <!-- legs -->
            <g id="legs">
              <rect x="92" y="330" width="30" height="66" rx="14" fill="#3b4a63"/>
              <rect x="138" y="330" width="30" height="66" rx="14" fill="#3b4a63"/>
              <rect x="86" y="384" width="42" height="18" rx="9" fill="#546179"/>
              <rect x="132" y="384" width="42" height="18" rx="9" fill="#546179"/>
            </g>
            <!-- shorts -->
            <path d="M74 300 L186 300 L190 344 Q190 352 182 352 L140 352 L130 318 L120 352 L78 352 Q70 352 70 344 Z" fill="#4f6ea8"/>

            <!-- torso (see-through) -->
            <rect x="48" y="104" width="164" height="218" rx="38" fill="url(#torsoGrad)" stroke="rgba(255,255,255,.5)" stroke-width="1.6"/>
            <ellipse id="bellyBulge" cx="132" cy="234" rx="56" ry="40" fill="rgba(255,168,138,.30)"/>

            <!-- arms -->
            <rect x="20" y="120" width="26" height="124" rx="13" fill="url(#skinGrad)"/>
            <rect x="214" y="120" width="26" height="124" rx="13" fill="url(#skinGrad)"/>

            <!-- neck -->
            <rect x="116" y="86" width="28" height="30" rx="12" fill="#f6c39a"/>

            <!-- head -->
            <g id="head">
              <circle cx="130" cy="54" r="42" fill="url(#skinGrad)"/>
              <circle cx="84" cy="58" r="10" fill="#f6c39a"/>
              <circle cx="176" cy="58" r="10" fill="#f6c39a"/>
              <path d="M88 48 C88 14 106 4 130 4 C154 4 172 14 172 48 C166 36 158 30 148 28 C134 36 116 36 104 28 C96 30 90 36 88 48 Z" fill="#2f2a35"/>
              <!-- eyes -->
              <g id="face">
                <circle cx="114" cy="52" r="5.4" fill="#2b2b33"/>
                <circle cx="146" cy="52" r="5.4" fill="#2b2b33"/>
                <circle cx="115.8" cy="50" r="1.8" fill="#fff"/>
                <circle cx="147.8" cy="50" r="1.8" fill="#fff"/>
                <!-- brows -->
                <path class="brow" d="M104 38 Q114 34 124 38" fill="none" stroke="#3a3242" stroke-width="2.6" stroke-linecap="round"/>
                <path class="brow" d="M136 38 Q146 34 156 38" fill="none" stroke="#3a3242" stroke-width="2.6" stroke-linecap="round"/>
                <!-- mouth: opens while chewing -->
                <ellipse id="mouth" cx="130" cy="74" rx="13" ry="4.5" fill="#a8453f"/>
                <ellipse id="tongue" cx="130" cy="76" rx="8" ry="2.6" fill="#e2777a"/>
                <!-- teeth -->
                <g id="teeth">
                  <path d="M119 70 L141 70 L141 72 L119 72 Z" fill="#ffffff" opacity="0.9"/>
                </g>
              </g>
              <!-- cheeks -->
              <ellipse class="blush" cx="102" cy="66" rx="9" ry="6" fill="#ff9a9a" opacity="0"/>
              <ellipse class="blush" cx="158" cy="66" rx="9" ry="6" fill="#ff9a9a" opacity="0"/>
            </g>
          </g>

          <!-- ───── digestive tract (built by body.js) ───── -->
          <g id="tract"></g>
          <g id="fx"></g>
          <g id="foodLayer"></g>
          <g id="labels"></g>

          <!-- ───── toilet ───── -->
          <g id="toilet" opacity="0">
            <rect x="176" y="352" width="18" height="30" rx="5" fill="#e8eef8"/>
            <rect x="166" y="344" width="46" height="14" rx="6" fill="#f5f8fc" stroke="#c8d2e0" stroke-width="1.4"/>
            <ellipse cx="189" cy="350" rx="15" ry="5" fill="#bcd3e8"/>
            <rect x="196" y="380" width="10" height="14" rx="4" fill="#dbe3ee"/>
            <rect x="214" y="330" width="8" height="14" rx="4" fill="#cfd8e6"/>
            <rect x="208" y="316" width="20" height="16" rx="5" fill="#e8eef8"/>
          </g>

          <!-- ───── dropped food / poo ───── -->
          <g id="dropped"></g>
        </svg>
      </div>

      <div class="speech" id="speech">I am hungry!</div>

      <div class="fact-card" id="fact-card">
        <div class="fact-label" data-i18n="factLabel">Did you know?</div>
        <div class="fact-text" id="fact-text"></div>
      </div>

      <div class="toast" id="toast"></div>
    </section>

  </main>
</div>

<!-- ══════════ HELP ══════════ -->
<div id="help-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="help-title">How food travels through you</h2>
    <p id="help-sub"></p>
    <div id="help-body" class="help-body"></div>
    <button class="overlay-close" id="help-close">OK</button>
  </div>
</div>

<!-- ══════════ QUIZ ══════════ -->
<div id="quiz-overlay" class="overlay" hidden>
  <div class="overlay-card quiz-card">
    <h2 id="quiz-title">Quiz time!</h2>
    <div id="quiz-body"></div>
    <button class="overlay-close" id="quiz-close">OK</button>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/progress.js"></script>

<script src="../shared/voice.js"></script>

<script src="../shared/shell.js"></script>

<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/body.js"></script>
<script src="js/deck.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
