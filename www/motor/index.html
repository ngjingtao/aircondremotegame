<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="电动机怎样工作：通电、加负载、用手转动或抓住转轴，看电流、发热和烧毁。" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="电动机" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<title>电动机 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="motor.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html#machines" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">⚙️</span>
      <span class="tb-title" data-i18n="title">Electric Motor</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudRpm">Speed</span><b id="hud-rpm">0</b></div>
      <div class="hud-chip hud-score"><span class="hud-label" data-i18n="hudAmp">Current</span><b id="hud-amp">0.0</b></div>
      <div class="hud-chip"><span class="hud-label" data-i18n="hudTemp">Coil</span><b id="hud-temp">25</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <section id="ctl-panel">
      <div id="ctl-scaler">
        <div class="ctl" id="ctl">

          <div class="fact-card" id="motor-fact"></div>

          <div class="power-row">
            <button class="power-btn" id="motor-power" data-action="power">
              <b data-i18n="powerOn">POWER</b>
            </button>
            <div class="heat-box">
              <span data-i18n="hudTemp">Coil</span>
              <div class="heat-bar"><i id="heat-fill"></i></div>
              <b id="heat-num">25°</b>
            </div>
          </div>

          <div class="ctl-label" data-i18n="voltage">Voltage</div>
          <div class="seg four" id="volt-row"></div>

          <div class="ctl-label" data-i18n="load">Load</div>
          <div class="seg four" id="load-row"></div>

          <div class="toggle-row">
            <button class="toggle-btn" id="btn-hold" data-action="hold">
              <span aria-hidden="true">✊</span><b data-i18n="hold">HOLD SHAFT</b>
            </button>
            <button class="toggle-btn" id="btn-hand" data-action="hand">
              <span aria-hidden="true">✋</span><b data-i18n="hand">TURN BY HAND</b>
            </button>
          </div>

          <div class="tasks" id="motor-tasks"></div>

          <button class="reset-btn" id="motor-reset" data-action="reset" data-i18n="reset">RESET MOTOR</button>
        </div>
      </div>
    </section>

    <section id="scene" data-status="idle">
      <div class="scene-top">
        <span class="scene-lead" data-i18n="lead">Motor cutaway</span>
        <span class="scene-status" id="scene-status" data-i18n="statusIdle">Stopped</span>
      </div>

      <div class="art-wrap">
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="mBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4f5f76"/>
              <stop offset="100%" stop-color="#222c3a"/>
            </linearGradient>
            <linearGradient id="mMetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f1f6fc"/>
              <stop offset="55%" stop-color="#b9c7d8"/>
              <stop offset="100%" stop-color="#7f90a6"/>
            </linearGradient>
            <linearGradient id="mCopper" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd08a"/>
              <stop offset="100%" stop-color="#c47a2c"/>
            </linearGradient>
            <radialGradient id="mHeat">
              <stop offset="0%" stop-color="rgba(255,120,60,.9)"/>
              <stop offset="55%" stop-color="rgba(255,90,40,.4)"/>
              <stop offset="100%" stop-color="rgba(255,80,30,0)"/>
            </radialGradient>
            <radialGradient id="mLed">
              <stop offset="0%" stop-color="#eafff2"/>
              <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
            </radialGradient>
            <filter id="mGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="mSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#04080f" flood-opacity=".5"/>
            </filter>
          </defs>

          <rect width="340" height="520" fill="#101923"/>
          <rect width="340" height="520" fill="url(#mBody)" opacity=".18"/>
          <rect y="470" width="340" height="50" fill="#0a1119"/>

          <!-- battery -->
          <g filter="url(#mSoft)">
            <rect x="18" y="196" width="66" height="116" rx="9" fill="#2b3546" stroke="#6b7c93" stroke-width="2"/>
            <rect x="30" y="184" width="12" height="14" rx="3" fill="#c8d1dd"/>
            <rect x="58" y="184" width="12" height="14" rx="3" fill="#c8d1dd"/>
            <text x="51" y="236" text-anchor="middle" font-size="18" fill="#ffd166" font-family="system-ui">+</text>
            <text x="51" y="286" text-anchor="middle" font-size="18" fill="#8fd0ff" font-family="system-ui">−</text>
            <circle id="gen-led" cx="51" cy="304" r="9" fill="url(#mLed)" opacity=".15"/>
            <circle cx="51" cy="304" r="3.2" fill="#a7f3c8" opacity=".8"/>
          </g>

          <!-- wires -->
          <path id="wire-top" d="M84 200 H128 Q148 200 148 220" fill="none" stroke="#c47a2c" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 11"/>
          <path id="wire-bot" d="M84 292 H128 Q148 292 148 270" fill="none" stroke="#8fd0ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 11"/>

          <!-- motor housing -->
          <g filter="url(#mSoft)">
            <circle cx="194" cy="246" r="126" fill="#1b2532" stroke="#5f7188" stroke-width="3"/>
            <path d="M194 120 A126 126 0 0 1 320 246 L194 246 Z" fill="#e85d5d" opacity=".82"/>
            <path d="M194 372 A126 126 0 0 1 68 246 L194 246 Z" fill="#5fb6ef" opacity=".82"/>
            <circle cx="194" cy="246" r="98" fill="#141c27" stroke="#95a6bb" stroke-width="2"/>
            <text x="276" y="150" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" opacity=".9" font-family="system-ui">N</text>
            <text x="112" y="350" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" opacity=".9" font-family="system-ui">S</text>
          </g>

          <!-- rotor coil -->
          <g id="rotor" transform="rotate(0 194 246)">
            <circle cx="194" cy="246" r="82" fill="none" stroke="#6b7c93" stroke-width="2" opacity=".5"/>
            <g stroke="url(#mCopper)" stroke-width="10" fill="none" stroke-linecap="round">
              <path d="M194 170 C236 170 252 206 252 246 C252 286 236 322 194 322"/>
              <path d="M194 170 C152 170 136 206 136 246 C136 286 152 322 194 322"/>
            </g>
            <rect x="174" y="226" width="40" height="40" rx="7" fill="url(#mMetal)" stroke="#7f90a6" stroke-width="1.4"/>
            <text x="194" y="251" text-anchor="middle" font-size="14" font-weight="800" fill="#243140" font-family="system-ui">M</text>
            <line x1="194" y1="246" x2="194" y2="150" stroke="#c8d1dd" stroke-width="4"/>
            <circle cx="194" cy="150" r="7" fill="#e0a51e" stroke="#8a5a10" stroke-width="1"/>
          </g>

          <!-- shaft and fan -->
          <line x1="258" y1="246" x2="322" y2="246" stroke="#c8d1dd" stroke-width="8" stroke-linecap="round"/>
          <g id="fan" transform="rotate(0 330 246)">
            <circle cx="330" cy="246" r="8" fill="#c8d1dd"/>
            <path d="M330 246 C316 218 322 198 340 192 C346 218 342 236 330 246 Z" fill="#8fd0ff" opacity=".9"/>
            <path d="M330 246 C358 232 372 240 376 258 C350 264 336 260 330 246 Z" fill="#8fd0ff" opacity=".75"/>
            <path d="M330 246 C342 274 336 294 318 300 C312 274 316 256 330 246 Z" fill="#8fd0ff" opacity=".9"/>
            <path d="M330 246 C302 260 288 252 284 234 C310 228 324 232 330 246 Z" fill="#8fd0ff" opacity=".75"/>
          </g>

          <!-- brushes and commutator -->
          <rect x="154" y="330" width="18" height="28" rx="4" fill="#6b7c93"/>
          <rect x="216" y="330" width="18" height="28" rx="4" fill="#6b7c93"/>
          <path d="M163 330 V312 M225 330 V312" stroke="#8fa0b4" stroke-width="4"/>

          <!-- heat, smoke, sparks -->
          <circle id="heat-glow" cx="194" cy="246" r="118" fill="url(#mHeat)" opacity="0" filter="url(#mGlow)"/>
          <g id="smoke" opacity="0">
            <path d="M182 128 q-16 -28 2 -50 q18 -22 4 -46" fill="none" stroke="#c8d1dd" stroke-width="8" stroke-linecap="round" opacity=".35"/>
            <path d="M206 120 q16 -26 0 -48 q-14 -20 2 -42" fill="none" stroke="#c8d1dd" stroke-width="7" stroke-linecap="round" opacity=".25"/>
          </g>
          <g id="sparks" opacity="0">
            <path d="M170 140 l-18 -26 M186 132 l-6 -32 M204 136 l12 -30 M218 148 l24 -22" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- hand indicators -->
          <text id="hand-icon" x="84" y="405" font-size="42" opacity="0" font-family="system-ui">✋</text>
          <text id="hold-icon" x="250" y="405" font-size="38" opacity="0" font-family="system-ui">✊</text>
        </svg>
      </div>
    </section>

  </main>
  <div class="toast" id="toast"></div>

  <div id="help-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="help-title" data-i18n="helpTitle">How the motor works</h2>
      <p id="help-sub" data-i18n="helpSub">Current in a coil, a magnet, and a commutator</p>
      <div id="help-body"></div>
      <button class="overlay-close" id="help-close">OK</button>
    </div>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/shell.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/scene.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
