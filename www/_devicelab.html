<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Device Lab — Play &amp; Learn</title>
<style>
  body{margin:0;background:#0b1220;color:#cbd5e1;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;}
  h1{font-size:15px;margin:0 0 4px;color:#38bdf8;}
  p.note{font-size:12px;color:#7f8ea8;margin:0 0 18px;}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;}
  .device{display:flex;flex-direction:column;gap:6px;}
  .label{font-size:11px;color:#93a3bd;letter-spacing:.4px;text-transform:uppercase;}
  .frame{border:10px solid #1e2839;border-radius:30px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);background:#000;}
  iframe{display:block;border:0;width:390px;height:760px;background:#0b1220;}
  a{color:#7dd3fc;}
</style>
</head>
<body>
  <h1>Device Lab</h1>
  <p class="note">Live view at real phone size. Pages: <a href="index.html">menu</a> · <a href="aircond/index.html">Play Aircond</a> · <a href="food/index.html">Food Eating</a></p>
  <div class="row">
    <div class="device">
      <div class="label">Home · 390 × 760</div>
      <div class="frame"><iframe src="index.html" title="menu"></iframe></div>
    </div>
    <div class="device">
      <div class="label">Play Aircond · 390 × 760</div>
      <div class="frame"><iframe src="aircond/index.html" title="aircond"></iframe></div>
    </div>
    <div class="device">
      <div class="label">Food Eating · 390 × 760</div>

    </div>
