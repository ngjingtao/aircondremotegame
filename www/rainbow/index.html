<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="彩虹与光：白光怎样经过折射、棱镜和雨滴分开成七色，怎样安全地做一道彩虹。" />
<meta name="format-detection" content="telephone=no" />
<!-- pwa -->
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="彩虹与光" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<!-- /pwa -->
<title>彩虹与光 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="../shared/lesson.css" />
<link rel="stylesheet" href="rainbow.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <a class="tb-btn home" href="../index.html#science" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand">
      <span class="tb-logo">🌈</span>
      <span class="tb-title" data-i18n="title">Rainbow &amp; Light</span>
    </div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudStep">Step</span><b id="hud-step">1 / 6</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>

    <section id="ctl-panel">
      <div id="ctl-scaler">
        <div class="ctl" id="ctl">

          <div class="ls-head">
            <span class="ls-kicker" data-i18n="lead">Rainbows and light</span>
            <span class="ls-count" id="ls-count">1 / 6</span>
            <button class="ls-read" id="ls-replay" data-action="replay" title="Read again">🔊</button>
          </div>
          <div class="ls-track"><i id="ls-bar"></i></div>

          <div class="ls-steps" id="ls-steps"></div>

          <h3 class="ls-title" id="ls-title"></h3>
          <div class="fact-card ls-fact" id="ls-fact"></div>

          <div class="ls-words" id="ls-words"></div>
          <div class="ls-worddef" id="ls-worddef" hidden></div>

          <div class="nav-row">
            <button class="nav-btn" id="ls-back" data-action="prev" data-i18n="back">BACK</button>
            <button class="nav-btn go" id="ls-next" data-action="next" data-i18n="next">NEXT</button>
          </div>

          <div class="result" id="ls-result" hidden>
            <div class="res-stars">★☆☆</div>
            <p id="ls-result-text"></p>
            <button class="nav-btn" data-action="again" data-i18n="again">START AGAIN</button>
          </div>

        </div>
      </div>
    </section>

    <section id="scene">

      <div class="scene-top">
        <span class="scene-lead" data-i18n="lead">Rainbows and light</span>
        <span class="scene-status" id="scene-status" data-i18n="status">Following the current</span>
      </div>

      <div class="art-wrap">
        <img id="art-plate" class="art-plate" alt="" hidden />
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="rbSun">
              <stop offset="0%" stop-color="#fff3b0"/><stop offset="55%" stop-color="#ffd166"/><stop offset="100%" stop-color="#f0a03a"/>
            </radialGradient>
            <linearGradient id="rbSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#162536"/><stop offset="100%" stop-color="#0a111a"/>
            </linearGradient>
            <linearGradient id="rbPrism" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#dff3ff"/><stop offset="100%" stop-color="#8fd0ff"/>
            </linearGradient>
            <radialGradient id="rbDrop">
              <stop offset="0%" stop-color="rgba(191,232,255,.75)"/><stop offset="100%" stop-color="rgba(85,160,210,.28)"/>
            </radialGradient>
            <radialGradient id="rbSpray">
              <stop offset="0%" stop-color="rgba(191,232,255,.55)"/><stop offset="100%" stop-color="rgba(191,232,255,0)"/>
            </radialGradient>
            <filter id="rbSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#05080d" flood-opacity=".45"/>
            </filter>
          </defs>

          <rect width="340" height="520" fill="url(#rbSky)"/>
          <rect y="474" width="340" height="46" fill="#070d13"/>

          <!-- sun + white beam -->
          <g class="lab" data-lab="white">
            <circle cx="48" cy="82" r="30" fill="url(#rbSun)" filter="url(#rbSoft)"/>
            <g stroke="#ffe9a8" stroke-width="2.4" stroke-linecap="round" opacity=".7">
              <path d="M48 40 v-12 M48 124 v12 M6 82 h-12 M90 82 h12 M18 52 l-8 -8 M78 52 l8 -8 M18 112 l-8 8 M78 112 l8 8"/>
            </g>
            <path id="white-beam" d="M76 90 C120 130 150 190 150 230" fill="none" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
            <path d="M58 112 C80 160 90 260 84 330" fill="none" stroke="#fff3b0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
          </g>

          <!-- prism at the bottom left -->
          <g class="lab" data-lab="prism">
            <path d="M28 410 L112 410 L70 340 Z" fill="url(#rbPrism)" fill-opacity=".28" stroke="#8fd0ff" stroke-width="2"/>
            <path d="M0 376 H64" stroke="#fff3b0" stroke-width="4" stroke-linecap="round"/>
            <g id="prism-fan" stroke-width="3" stroke-linecap="round" opacity=".9">
              <path d="M78 384 L118 436" stroke="#e85d5d"/>
              <path d="M80 382 L124 424" stroke="#f0a03a"/>
              <path d="M82 380 L128 412" stroke="#ffd166"/>
              <path d="M84 378 L130 400" stroke="#6fbf5f"/>
              <path d="M86 376 L130 388" stroke="#5fb6ef"/>
              <path d="M88 374 L128 376" stroke="#4a6fd8"/>
              <path d="M90 372 L124 364" stroke="#9b6fd8"/>
            </g>
          </g>

          <!-- raindrop and internal path -->
          <g class="lab" data-lab="drop">
            <circle cx="190" cy="256" r="82" fill="url(#rbDrop)" stroke="#bfe8ff" stroke-width="2" opacity=".85"/>
            <path d="M150 214 L178 242 M178 242 L170 286 M170 286 L214 300" fill="none" stroke="#fff3b0" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
            <path d="M150 214 L150 196" stroke="#fff3b0" stroke-width="2" opacity=".5"/>
          </g>

          <!-- rainbow arcs -->
          <g id="rainbow-arcs" class="lab" data-lab="colours" fill="none" stroke-linecap="round" opacity=".95">
            <path d="M96 292 A134 134 0 0 1 264 292" stroke="#e85d5d" stroke-width="8"/>
            <path d="M108 292 A122 122 0 0 1 252 292" stroke="#f0a03a" stroke-width="8"/>
            <path d="M120 292 A110 110 0 0 1 240 292" stroke="#ffd166" stroke-width="8"/>
            <path d="M132 292 A98 98 0 0 1 228 292" stroke="#6fbf5f" stroke-width="8"/>
            <path d="M144 292 A86 86 0 0 1 216 292" stroke="#5fb6ef" stroke-width="8"/>
            <path d="M156 292 A74 74 0 0 1 204 292" stroke="#4a6fd8" stroke-width="8"/>
            <path d="M168 292 A62 62 0 0 1 192 292" stroke="#9b6fd8" stroke-width="8"/>
          </g>

          <!-- refract markers -->
          <g class="lab" data-lab="refract" fill="none" stroke="#8fd0ff" stroke-width="2.4" stroke-linecap="round">
            <path d="M126 204 Q142 218 150 230"/>
            <path d="M214 300 Q236 288 252 274"/>
            <circle cx="150" cy="230" r="4" fill="#8fd0ff"/>
            <circle cx="214" cy="300" r="4" fill="#8fd0ff"/>
          </g>

          <!-- make + protect -->
          <g class="lab" data-lab="make">
            <circle id="make-spray" cx="154" cy="420" r="46" fill="url(#rbSpray)"/>
            <g stroke="#bfe8ff" stroke-width="2" stroke-linecap="round" opacity=".8">
              <path d="M128 420 q-12 -8 -20 0 M150 404 q-4 -14 6 -18 M168 426 q14 -6 20 4"/>
            </g>
            <path d="M236 398 q18 -10 36 0 q18 10 36 0" fill="none" stroke="#3ddc84" stroke-width="4" stroke-linecap="round"/>
            <path d="M242 386 q12 -8 24 0 M278 386 q12 -8 24 0" fill="none" stroke="#3ddc84" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M40 400 l20 -8 20 8 v18 c0 14 -10 22 -20 26 c-10 -4 -20 -12 -20 -26 Z" fill="rgba(61,220,132,.16)" stroke="#3ddc84" stroke-width="2.2"/>
          </g>
        </svg>
      </div>

      <div class="pane-note" id="pane-note"></div>
    </section>

  </main>
</div>

<div id="help-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <h2 id="help-title">How a rainbow is made</h2>
    <div id="help-body" class="help-body"></div>
    <button class="overlay-close" id="help-close">OK</button>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/lang.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="../shared/art.js"></script>
<script src="js/scene.js"></script>
<script src="../shared/lesson.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
