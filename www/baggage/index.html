<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../shared/config.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script src="../shared/prepaint.js"></script>
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="机场行李系统：行李从值机、传送带、X 光、分拣滑槽到飞机，学习行李怎样被运送。" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="机场行李系统" />
<link rel="apple-touch-icon" sizes="180x180" href="../icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="../icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="../icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="../icons/icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<title>机场行李系统 · 边玩边学</title>
<link rel="stylesheet" href="../shared/ui.css" />
<link rel="stylesheet" href="baggage.css" />
</head>
<body>

<div id="app">
  <header id="topbar">
    <a class="tb-btn home" href="../index.html#body" title="Back to menu">‹ <span data-i18n="menu">Menu</span></a>
    <div class="tb-brand"><span class="tb-logo">🧳</span><span class="tb-title" data-i18n="title">Airport Baggage</span></div>
    <div class="tb-hud">
      <div class="hud-chip"><span class="hud-label" data-i18n="hudScore">Sorted</span><b id="hud-score">0</b></div>
      <div class="hud-chip hud-score"><span class="hud-label" data-i18n="hudMistakes">Mishandled</span><b id="hud-miss">0</b></div>
    </div>
    <div class="tb-buttons">
      <button class="tb-btn" id="btn-panel" title="Hide controls">◧</button>
      <button class="tb-btn" id="btn-voice" title="Voice">🗣️</button>
      <button class="tb-btn" id="btn-lang">EN</button>
      <button class="tb-btn" id="btn-sound">🔊</button>
      <button class="tb-btn" id="btn-help">?</button>
    </div>
  </header>

  <main>
    <section id="ctl-panel">
      <div id="ctl-scaler"><div class="ctl" id="ctl">
        <div class="fact-card" id="bag-fact"></div>

        <div class="tag-card">
          <span class="tag-label" data-i18n="bagTag">Bag tag</span>
          <div class="tag-main"><b id="tag-code">KUL</b><i id="tag-city">Kuala Lumpur</i></div>
          <div class="tag-sub"><span data-i18n="flight">Flight</span><b id="tag-flight">AK 101</b><span id="tag-no">#1 / 8</span></div>
        </div>

        <div class="ctl-label" data-i18n="chute">Choose the make-up chute</div>
        <div class="chutes" id="chute-row"></div>

        <div class="belt-wrap"><div class="belt-bar"><i id="belt-fill"></i></div><span id="belt-note">—</span></div>

        <div class="feedback" id="bag-feedback"></div>

        <div class="run-row">
          <button class="run-btn" data-action="start" id="btn-start" data-i18n="start">START SHIFT</button>
          <button class="clear-btn" data-action="reset" data-i18n="reset">NEW SHIFT</button>
        </div>

        <div class="result" id="bag-result" hidden>
          <div class="res-stars" id="bag-stars">★★★</div>
          <p id="bag-res-text"></p>
          <button class="run-btn" data-action="reset" data-i18n="again">PLAY AGAIN</button>
        </div>
      </div></div>
    </section>

    <section id="scene">
      <div class="scene-top">
        <span class="scene-lead" data-i18n="lead">Baggage handling</span>
        <span class="scene-status" id="scene-status" data-i18n="statusIdle">Ready at check-in</span>
      </div>

      <div class="art-wrap">
        <svg id="art" viewBox="0 0 340 520" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#182a3d"/><stop offset="100%" stop-color="#0b1420"/>
            </linearGradient>
            <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5d6b7d"/><stop offset="100%" stop-color="#2b3542"/>
            </linearGradient>
            <linearGradient id="planeGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e8eef6"/><stop offset="100%" stop-color="#aab8c8"/>
            </linearGradient>
            <filter id="bSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#05080d" flood-opacity=".4"/>
            </filter>
          </defs>

          <rect width="340" height="520" fill="url(#bgWall)"/>
          <rect y="470" width="340" height="50" fill="#080f17"/>
          <path d="M0 390 H340 V470 H0 Z" fill="#101b26"/>
          <path d="M0 390 H340" stroke="#2b3b4d" stroke-width="1.4"/>

          <!-- check-in desk -->
          <g filter="url(#bSoft)">
            <rect x="16" y="330" width="70" height="58" rx="8" fill="#2f4a63" stroke="#5f7c9c" stroke-width="2"/>
            <rect x="24" y="318" width="54" height="14" rx="4" fill="#3f5e7c"/>
            <text x="51" y="352" text-anchor="middle" font-size="9" fill="#cfe6ff" font-family="system-ui">CHECK-IN</text>
          </g>

          <!-- belt -->
          <path d="M80 356 H250" stroke="url(#beltGrad)" stroke-width="26" stroke-linecap="round"/>
          <path d="M80 356 H250" stroke="#1a2530" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/>

          <!-- X-ray arch -->
          <g filter="url(#bSoft)">
            <rect x="112" y="292" width="34" height="64" rx="7" fill="#27323f" stroke="#5f7188" stroke-width="2"/>
            <rect x="120" y="300" width="18" height="48" rx="4" fill="#0d141d" stroke="#67e8f9" stroke-width="1.2" opacity=".8"/>
            <path id="scan-beam" d="M129 302 V346" stroke="#67e8f9" stroke-width="3" opacity=".25"/>
          </g>

          <!-- sorter + chutes -->
          <g filter="url(#bSoft)">
            <rect x="238" y="326" width="46" height="34" rx="6" fill="#27323f" stroke="#5f7188" stroke-width="2"/>
            <path d="M284 340 H306" stroke="#8fa0b4" stroke-width="7" stroke-linecap="round"/>
          </g>
          <g id="chute0" class="chute">
            <path d="M258 360 V416 H222" fill="none" stroke="#5fb6ef" stroke-width="13" stroke-linecap="round"/>
            <text x="222" y="438" font-size="10" font-weight="800" fill="#9fdcff" font-family="system-ui">KUL</text>
          </g>
          <g id="chute1" class="chute">
            <path d="M270 360 V440" fill="none" stroke="#f0a03a" stroke-width="13" stroke-linecap="round"/>
            <text x="264" y="462" font-size="10" font-weight="800" fill="#ffd09a" font-family="system-ui">SIN</text>
          </g>
          <g id="chute2" class="chute">
            <path d="M282 360 V416 H306" fill="none" stroke="#6fbf5f" stroke-width="13" stroke-linecap="round"/>
            <text x="300" y="438" font-size="10" font-weight="800" fill="#b8f5c8" font-family="system-ui">BKI</text>
          </g>

          <!-- aircraft -->
          <g filter="url(#bSoft)">
            <path d="M244 250 q20 -14 44 0 q18 12 0 24 q-24 12 -44 0 Z" fill="url(#planeGrad)" stroke="#8fa0b4" stroke-width="1.4"/>
            <path d="M268 246 l-22 -18 M268 246 l-22 18" stroke="#c8d1dd" stroke-width="5" stroke-linecap="round"/>
            <circle cx="276" cy="246" r="7" fill="#8fd0ff" opacity=".7"/>
          </g>

          <!-- moving bag -->
          <g id="bag-token" transform="translate(90 0)">
            <rect x="0" y="338" width="34" height="24" rx="4" fill="#c47a2c" stroke="#7a4a16" stroke-width="1.4"/>
            <path d="M10 338 v-6 h14 v6" fill="none" stroke="#7a4a16" stroke-width="2"/>
            <rect x="7" y="344" width="20" height="9" rx="2" fill="#f4efe4"/>
            <text id="bag-code" x="17" y="352" text-anchor="middle" font-size="7" font-weight="800" fill="#3b2a16" font-family="system-ui">KUL</text>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div id="help-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="help-title" data-i18n="helpTitle">How airport baggage works</h2>
      <p id="help-sub" data-i18n="helpSub">Check-in to the aircraft</p>
      <div id="help-body"></div>
      <button class="overlay-close" id="help-close">OK</button>
    </div>
  </div>
</div>

<script src="../shared/store.js"></script>
<script src="../shared/lang.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/a11y.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/shell.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/scene.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
<script src="../pwa.js"></script>
</body>
</html>
